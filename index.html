<!-- Plain, self-contained build of Quiz 2 (COM-M1-QZ-02): no framework and nothing to download.
     It works opened from disk, from any host, and in previews that block browser storage.

<style>
:root {
  --page: #fbfbfe; --card: #ffffff; --heading: #0e1a4f; --body: #4c5682; --muted: #5a6389; --border: #e4e8f5;
  --primary: #3c59f6; --primary-hover: #2f4ae0; --select-bg: rgba(60,89,246,.08); --blue-tonal-border: rgba(60,89,246,.35);
  --amber: #f3ab31; --amber-2: #ffc168; --amber-text: #8f5600; --amber-on: #241300;
  --success: #1c7f59; --success-bg: rgba(79,224,168,.16); --success-border: rgba(28,154,107,.4);
  --warn-bg: #fff8e6; --warn-border: #f3c96b; --warn-text: #6b4300; --overlay: rgba(14,26,79,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
/* Text grows a little on bigger screens: 16 px on phones and small laptops, up to 19 px on large monitors. */
html { font-size: clamp(16px, calc(9px + 0.55vw), 19px); }
body { font-size: 1rem; background: var(--page); color: var(--body); font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.4; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
img { display: block; max-width: 100%; }
/* Sizes (client feedback, 16 Oct 2026): first "too large", then "too small". Set between the two: readable text, with each question close to one screen. */
.top { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 16px; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 0.7813rem; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--heading); }
.brand img { height: 20px; width: auto; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: #fff; color: var(--heading); font-size: 0.9375rem; font-weight: 600; cursor: pointer; }
.btn-ghost:hover { border-color: var(--blue-tonal-border); }
.timer { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--blue-tonal-border); background: var(--select-bg); color: var(--primary-hover); font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.low { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-text); }
.timer[hidden] { display: none; }
.layout { max-width: 1240px; margin: 0 auto; padding: 4px 16px 92px; display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0,1fr) 290px; padding: 4px 32px 24px; }
  aside { position: sticky; top: 12px; align-self: start; }
}
.card { align-self: start; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
@media (min-width: 640px) { .card { padding: 24px 30px 28px; } }
.card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: .18em; color: var(--amber-text); }
.eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--amber); }
.badge { display: inline-block; padding: 3px 11px; border-radius: 999px; background: var(--select-bg); color: var(--primary-hover); font-size: 0.875rem; font-weight: 600; }
.qline { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; margin-top: 14px; }
.qnum { font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.dots { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
.dots li { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
.dots li.done { background: rgba(60,89,246,.4); }
.dots li.now { background: var(--primary); }
h1 { color: var(--heading); font-size: 1.375rem; line-height: 1.3; margin: 12px 0 0; font-weight: 700; text-wrap: balance; }
@media (min-width: 640px) { h1 { font-size: 1.625rem; } }
.howto { margin: 8px 0 0; font-size: 1.0625rem; }
.q-body { margin-top: 18px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 48px; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 13px; background: #fff; color: var(--heading); font-size: 1.125rem; font-weight: 500; text-align: left; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--blue-tonal-border); }
.opt[aria-pressed="true"] { border-color: var(--primary); background: var(--select-bg); }
.opt.right { border-color: var(--success); background: var(--success-bg); }
.opt:disabled { cursor: default; }
.tick { flex: none; width: 20px; height: 20px; }
.q-image { margin: 0 auto 12px; max-height: 84px; width: auto; }
.pics { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; max-width: 660px; }
.pic { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border: 1.5px solid var(--border); border-radius: 13px; background: #fff; color: var(--heading); font-size: 1.0625rem; font-weight: 600; cursor: pointer; }
.pic img { width: 100%; height: auto; }
.pic[aria-pressed="true"] { border-color: var(--primary); background: var(--select-bg); }
.pic.right { border-color: var(--success); background: var(--success-bg); }
.pic .tick { position: absolute; top: -8px; right: -8px; background: #fff; border-radius: 50%; }
.scene { position: relative; max-width: 680px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.scene > img { width: 100%; height: auto; }
.spot { position: absolute; padding: 2px; border: 3px solid transparent; border-radius: 8px; background: transparent; cursor: pointer; }
.spot img { width: 100%; height: auto; }
.spot:hover:not(:disabled) { border-color: var(--blue-tonal-border); }
.spot[aria-pressed="true"] { border-color: var(--primary); background: rgba(60,89,246,.15); }
.spot.right { border-color: var(--success); background: rgba(79,224,168,.3); }
.board { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; max-width: 760px; }
.target { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
.target img { height: 50px; width: auto; }
@media (min-width: 640px) { .target img { height: 80px; } }
.slot { width: 100%; min-height: 56px; padding: 7px; border: 1.5px dashed var(--blue-tonal-border); border-radius: 10px; background: #fff; color: var(--muted); font-size: 0.9688rem; line-height: 1.3; cursor: pointer; touch-action: none; }
.slot.filled { border-style: solid; border-color: var(--primary); background: var(--select-bg); color: var(--heading); font-weight: 600; }
.slot.hover { background: rgba(60,89,246,.16); }
.slot.right { border-color: var(--success); background: var(--success-bg); }
.tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; padding: 4px; border-radius: 12px; max-width: 760px; }
.tray.hover { background: var(--select-bg); }
.chip { padding: 7px 14px; min-height: 44px; border: 1.5px solid var(--blue-tonal-border); border-radius: 10px; background: #fff; color: var(--heading); font-size: 1.0313rem; font-weight: 600; cursor: grab; touch-action: none; }
.chip[aria-pressed="true"] { border-color: var(--primary); background: var(--select-bg); box-shadow: 0 0 0 3px rgba(60,89,246,.25); }
.chip:disabled { opacity: .45; cursor: default; }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%,-50%) rotate(-2deg); box-shadow: 0 12px 28px rgba(14,26,79,.25); }
.fb { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; padding: 11px 14px; border-radius: 12px; font-size: 1.0625rem; }
.fb.right { background: var(--success-bg); border: 1px solid var(--success-border); color: #0f4f37; }
.fb.wrong { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); }
.fb b { font-weight: 700; }
aside .rail-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin: 4px 0 8px; }
.rail { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 0.9375rem; color: var(--body); }
.rail li { display: flex; gap: 8px; align-items: flex-start; }
.rail .mark { flex: none; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--border); margin-top: 1px; }
.rail li[aria-current="step"] { color: var(--heading); font-weight: 700; }
.rail li[aria-current="step"] .mark { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 0 3px rgba(243,171,49,.25); }
.note { font-size: 0.875rem; margin: 12px 0 0; }
.action { margin-top: 14px; }
.btn-amber { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 0 26px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--amber-2), var(--amber)); color: var(--amber-on); font-size: 1.125rem; font-weight: 700; box-shadow: 0 6px 18px rgba(243,171,49,.3); cursor: pointer; }
.btn-amber:disabled { background: #fbe3b9; color: #9a8466; box-shadow: none; cursor: not-allowed; }
.btn-blue { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 1px solid var(--blue-tonal-border); border-radius: 999px; background: var(--select-bg); color: var(--primary-hover); font-size: 1rem; font-weight: 600; cursor: pointer; }
@media (max-width: 899px) {
  /* Phones and small tablets: the list of stages is left out so the question and its answers come first. */
  aside .rail-label, aside .rail, aside .note { display: none; }
  .action { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--page); border-top: 1px solid var(--border); }
}
.center { text-align: center; }
.closing img { margin: 10px auto 0; max-height: 130px; width: auto; }
.closing h1, .end h1 { margin-top: 12px; }
.closing p, .end p { font-size: 1.1563rem; }
.modal-bg { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--overlay); }
.modal { width: 100%; max-width: 400px; background: #fff; border-radius: 18px; padding: 22px; text-align: center; }
.modal h2 { color: var(--heading); margin: 0 0 6px; font-size: 1.375rem; }
.modal p { margin: 0 0 16px; }
.modal .row { display: grid; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

    e.preventDefault();
    drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
    var t = dropTarget(e.clientX, e.clientY), over = t ? t.el : null;
    if (drag.over && drag.over !== over) drag.over.classList.remove("hover");
    if (over) over.classList.add("hover"); drag.over = over;
  }
  function endDrag() {
    window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", onCancel);
    if (drag && drag.ghost) drag.ghost.remove();
  }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; endDrag(); drag = null;
    if (!d.moving) return; // a tap: the click handler deals with it
    var t = dropTarget(e.clientX, e.clientY);
    if (t && t.slot) put(d.meaning, t.slot, d.from);
    else if (d.from) backToTray(d.from); // dropped on the tray, or anywhere off the signs
    // A mouse or pen drag ends with a click on whatever is under it: ignore that one click only.
    if (!d.touch) { suppressClick = true; setTimeout(function () { suppressClick = false; }, 0); }
    render();
  }
  function onCancel() { endDrag(); drag = null; render(); }

  // ---------- Screens ----------
  var lastFocus = null;
  function focusTestId(id) { if (!id) return; var el = document.querySelector('[data-testid="' + CSS.escape(id) + '"]'); if (el) el.focus({ preventScroll: true }); }
  document.addEventListener("focusin", function (e) { var id = e.target.getAttribute && e.target.getAttribute("data-testid"); if (id) lastFocus = id; });

  function questionBody(it) {
    var lock = st.result === "right";
    if (it.kind === "choice") {
      return h("div", {}, [
        it.image ? h("img", { class: "q-image", src: IMG[it.image.src], alt: it.image.alt, testid: "quiz-image" }) : null,
        h("div", { class: "opts", role: "group", "aria-label": "Answers" }, it.options.map(function (o) {
          var on = st.sel === o, ok = lock && on;
          return h("button", { type: "button", class: "opt" + (ok ? " right" : ""), "aria-pressed": on ? "true" : "false", disabled: lock, testid: "opt-" + o, onclick: function () { choose(o); } },
            [h("span", { text: o }), ok ? tick() : null]);
        }))]);
    }
    if (it.kind === "picture") {
      return h("div", { class: "pics", role: "group", "aria-label": "Answers" }, it.options.map(function (o) {
        var on = st.sel === o.id, ok = lock && on;
        return h("button", { type: "button", class: "pic" + (ok ? " right" : ""), "aria-pressed": on ? "true" : "false", disabled: lock, "aria-label": o.alt, testid: it.id + "-" + o.id, onclick: function () { choose(o.id); } },
          [h("img", { src: IMG[o.id], alt: "" }), h("span", { text: o.label, "aria-hidden": "true" }), ok ? tick() : null]);
      }));
    }
    if (it.kind === "scene") {
      return h("div", { class: "scene", testid: "scene" }, [h("img", { src: IMG[it.scene.src], alt: it.scene.alt })].concat(it.spots.map(function (sp) {
        var on = st.sel === sp.id, ok = lock && on;
        return h("button", { type: "button", class: "spot" + (ok ? " right" : ""), style: "left:" + sp.left + "%;top:" + sp.top + "%;width:" + sp.width + "%",
          "aria-pressed": on ? "true" : "false", disabled: lock, "aria-label": sp.alt, testid: it.id + "-" + sp.id, onclick: function () { choose(sp.id); } },
          [h("img", { src: IMG[sp.src], alt: "" })]);
      })));
    }
    // match
    var board = h("div", { class: "board", testid: "match-board" }, it.targets.map(function (t) {
      var m = st.slots[t.id];
      var slot = h("button", { type: "button", class: "slot" + (m ? " filled" : "") + (lock ? " right" : ""), "data-slot": t.id, testid: "slot-" + t.id,
        "aria-label": (m ? "Meaning for the " + t.alt + ": " + m.replace(/\.$/, "") + ". Tap to send it back." : "Box for the " + t.alt + ". Empty.") ,
        disabled: lock, onclick: function () { tapSlot(t.id); }, text: m || UI.drop });
      if (m && !lock) slot.addEventListener("pointerdown", function (e) { onDown(e, m, t.id); });
      return h("div", { class: "target", testid: "target-" + t.id }, [h("img", { src: IMG[t.src], alt: t.alt }), slot]);
    }));
    var tray = h("div", { class: "tray", "data-tray": "1", testid: "word-tray", role: "group", "aria-label": "Meanings" }, it.chips.map(function (m) {
      var used = !!placed(m);
      var c = h("button", { type: "button", class: "chip", "aria-pressed": picked === m ? "true" : "false", disabled: used || lock, testid: "word-" + m, onclick: function () { tapChip(m); }, text: m });
      if (!used && !lock) c.addEventListener("pointerdown", function (e) { onDown(e, m, null); });
      return c;
    }));
    return h("div", {}, [board, tray]);
  }

  function rail() {
    return h("aside", { "aria-label": "In this segment" }, [
      h("p", { class: "rail-label", text: "In this segment" }),
      h("ol", { class: "rail", testid: "segment-rail" }, RAIL.map(function (r) {
        return h("li", { "aria-current": r[0] === "5.8" ? "step" : null }, [h("span", { class: "mark", "aria-hidden": "true" }), h("span", { text: r[0] + " " + r[1] })]);
      })),
      h("p", { class: "note", text: UI.note }),
      h("div", { class: "action" }, [actionButton()])
    ]);
  }
  function actionButton() {
    if (st.end) return h("button", { type: "button", class: "btn-amber", testid: "try-again", onclick: function () { fresh("again"); render(); }, text: "Try again" });
    if (st.done) return h("button", { type: "button", class: "btn-amber", testid: "continue", onclick: function () { st.end = true; render(); } }, ["Continue", arrow()]);
    if (st.result === "right") return h("button", { type: "button", class: "btn-amber", testid: "continue", onclick: next }, ["Continue", arrow()]);
    return h("button", { type: "button", class: "btn-amber", testid: "check", disabled: !answered(), onclick: check }, ["Check", arrow()]);
  }
  function arrow() { var s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width", "16"); s.setAttribute("height", "16"); s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("aria-hidden", "true"); s.innerHTML = '<path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'; return s; }

  function cardTop() {
    return h("div", { class: "card-top" }, [h("span", { class: "eyebrow", testid: "expected-time", text: "Quick Check · About 10 minutes" }), h("span", { class: "badge", testid: "practice-label", text: "Self-check · not graded" })]);
  }
  function render() {
    var app = document.getElementById("app"); app.innerHTML = "";
    var card;
    if (st.end) {
      card = st.left
        ? h("section", { class: "card center end", testid: "standalone-left" }, [cardTop(), h("h1", { tabindex: "-1", text: "You left the Quick Check" }), h("p", { text: "You can start it again whenever you are ready." })])
        : h("section", { class: "card center end", testid: "standalone-end" }, [cardTop(), h("h1", { tabindex: "-1", text: "Quick Check complete" }), h("p", { text: "You finished the Quick Check. You can try it again, or close this page." })]);
    } else if (st.done) {
      card = h("section", { class: "card center closing", testid: "closing" }, [cardTop(), h("img", { src: IMG.header, alt: "Four common signs: stop, exit, wet floor and reception." }),
        h("h1", { tabindex: "-1", text: "Well done!" }), h("p", { text: "You practised reading signs carefully, and checking them twice when you are not sure." })]);
    } else {
      var it = item();
      card = h("section", { class: "card", "aria-labelledby": "qhead" }, [
        cardTop(),
        h("div", { class: "qline" }, [
          h("span", { class: "qnum", text: "Question " + (st.q + 1) + " of " + ITEMS.length + " · " + it.label }),
          h("ol", { class: "dots", testid: "progress-dots", "aria-label": "Question " + (st.q + 1) + " of " + ITEMS.length }, ITEMS.map(function (_, i) {
            return h("li", { class: i < st.q ? "done" : i === st.q ? "now" : "" });
          }))]),
        h("h1", { id: "qhead", tabindex: "-1", text: it.prompt }),
        it.howTo ? h("p", { class: "howto", text: it.howTo }) : null,
        h("div", { class: "q-body" }, [questionBody(it)]),
        st.result === "right" ? h("div", { class: "fb right", testid: "feedback-right", tabindex: "-1", role: "status" }, [tick(), h("span", {}, [h("b", { text: UI.right }), h("span", { testid: "feedback-why", text: " " + it.why })])]) : null,
        st.result === "wrong" ? h("div", { class: "fb wrong", testid: "feedback-wrong", tabindex: "-1", role: "status", text: UI.wrong }) : null
      ]);
    }
    app.appendChild(card); app.appendChild(rail());
  }

  // ---------- Pause and Close ----------
  function showModal(testid, title, text, buttons, extra) {
    var m = document.getElementById("modal"); m.innerHTML = "";
    var box = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "mtitle", testid: testid }, [
      h("h2", { id: "mtitle", text: title }), h("p", { text: text, testid: extra }),
      h("div", { class: "row" }, buttons.map(function (b, i) { return h("button", { type: "button", class: i === 0 ? "btn-amber" : "btn-blue", testid: b[1], onclick: b[2], text: b[0] }); }))]);
    m.appendChild(h("div", { class: "modal-bg" }, [box])); box.querySelector("button").focus();
  }
  function closeModal() { document.getElementById("modal").innerHTML = ""; }
  document.getElementById("close").addEventListener("click", function () {
    if (st.done) { st.end = true; render(); return; } // already finished: nothing to lose
    // The timer keeps running while this question is open.
    showModal("close-card", "Leave the Quick Check?", "If you leave now, this attempt will not be finished.", [
      ["Keep going", "close-stay", function () { closeModal(); }],
      ["Leave", "close-leave", function () { closeModal(); st.attempt.closed = true; saveAttempt(st.attempt); stopTimer(); st.done = true; st.end = true; st.left = true; render(); }]]);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && picked) { picked = null; render(); } });

  fresh(null); render();
})();
</script>
