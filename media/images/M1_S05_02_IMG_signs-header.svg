<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" role="img" aria-label="Four common signs: stop, exit, wet floor, reception">
  <!-- INTERIM ART (Stage 5.2 header): flat collage of the four signs named in the brief. -->
  <g stroke="#0e1a4f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 1. Stop sign: red octagon on a post -->
    <line x1="48" y1="78" x2="48" y2="96" />
    <polygon points="34,8 62,8 82,28 82,56 62,76 34,76 14,56 14,28" fill="#d63a2f" />
    <text x="48" y="48" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff" stroke="none" text-anchor="middle">STOP</text>

    <!-- 2. Exit sign: green with a running figure and an arrow -->
    <rect x="102" y="22" width="92" height="50" rx="5" fill="#1f9d55" />
    <g stroke="#ffffff" stroke-width="3" fill="none">
      <circle cx="124" cy="32" r="3.6" fill="#ffffff" stroke="none" />
      <path d="M122 38 L128 50 L120 62" />
      <path d="M128 50 L136 58" />
      <path d="M116 44 L124 39 L132 44" />
      <path d="M146 47 H176 M168 39 L176 47 L168 55" />
    </g>
    <text x="148" y="68" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff" stroke="none" text-anchor="middle">EXIT</text>

    <!-- 3. Wet-floor A-frame: yellow -->
    <polygon points="236,14 262,14 276,92 222,92" fill="#f5c22b" />
    <line x1="226" y1="74" x2="272" y2="74" />
    <g stroke="#0e1a4f" stroke-width="2.4" fill="none">
      <circle cx="250" cy="30" r="3" fill="#0e1a4f" stroke="none" />
      <path d="M249 35 L246 48 L254 56" />
      <path d="M246 48 L238 54" />
      <path d="M244 40 L256 38" />
      <path d="M234 64 Q242 60 250 64 T266 64" />
    </g>

    <!-- 4. Reception: desk with a bell, under a board -->
    <rect x="300" y="14" width="88" height="22" rx="4" fill="#3c59f6" />
    <text x="344" y="30" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" stroke="none" text-anchor="middle">RECEPTION</text>
    <circle cx="344" cy="52" r="6" fill="#f3ab31" />
    <path d="M334 62 Q344 52 354 62 Z" fill="#f3ab31" />
    <rect x="306" y="62" width="76" height="12" rx="2" fill="#c98a52" />
    <rect x="312" y="74" width="64" height="20" fill="#e3b07c" />
  </g>
</svg>
